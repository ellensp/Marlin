#
# Marlin Firmware
# Test: RP2350/config-02.ini
#
# Flash EEPROM, MCU temperature, fast PWM fan, endstop interrupts and M43
#

[config:base]
motherboard                              = BOARD_RASPBERRY_PI_PICO2
eeprom_settings                          = on
temp_sensor_soc                          = 100
fast_pwm_fan                             = on
endstop_interrupts_feature               = on
pins_debugging                           = on
direct_pin_control                       = on
marlin_dev_mode                          = on
